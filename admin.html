<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="adminPage"><div class="wrap adminWrap"><a href="index.html" class="back">← Public website</a><h1>Clinic Admin</h1><div id="loginPanel" class="panel"><h2>Admin login</h2><form id="loginForm"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn">Login</button><p id="loginStatus" class="status"></p></form></div><div id="dashboard" hidden><div class="adminTop"><p>Manage website content and feedback.</p><button class="btn secondary" id="logoutBtn">Logout</button></div><div class="tabs"><button data-tab="content" class="active">Website editor</button><button data-tab="feedback">Feedback</button><button data-tab="settings">Settings</button></div><section id="contentTab" class="panel"><h2>Website content editor</h2><p>Change fields below. JSON fields let you manage services and sections. Save changes to publish.</p><form id="contentForm"><label>Clinic name<input name="clinic_name"></label><label>Tagline<input name="tagline"></label><label>Hero heading<textarea name="hero_title"></textarea></label><label>Hero text<textarea name="hero_text"></textarea></label><label>About heading<input name="about_title"></label><label>About text<textarea name="about_text"></textarea></label><label>Doctor name<input name="doctor_name"></label><label>Qualifications<input name="qualifications"></label><label>Mission<textarea name="mission"></textarea></label><label>Services JSON<textarea name="services_json" rows="10"></textarea></label><label>Logo text / symbol<input name="logo_text"></label><label>Hero image URL<input name="hero_image"></label><label>Doctor image URL<input name="doctor_image"></label><button class="btn">Save website content</button><p id="contentStatus" class="status"></p></form></section><section id="feedbackTab" class="panel" hidden><h2>Feedback moderation</h2><div id="feedbackAdmin"></div></section><section id="settingsTab" class="panel" hidden><h2>Clinic settings</h2><form id="settingsForm"><label>Phone<input name="phone"></label><label>WhatsApp number (country code, digits only)<input name="whatsapp"></label><label>Email<input name="email"></label><label>Address<textarea name="address"></textarea></label><label>Opening hours<textarea name="hours"></textarea></label><label>Google Maps embed URL<input name="map_embed"></label><label>Google Maps link<input name="map_link"></label><label>Primary color<input name="primary_color" placeholder="#477b65"></label><label>Footer text<input name="footer"></label><button class="btn">Save settings</button><p id="settingsStatus" class="status"></p></form></section></div></div><script src="app.js"></script></body></html>
